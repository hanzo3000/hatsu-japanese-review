<body><div class="loading"><b>日本語复习本</b><span>正在加载 v4.3.0…</span></div>
<script>
(async()=>{
  try{
    let html=await fetch('./base-v4.0.1.html?v=430',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.text()});
    html=html.replace('<html lang="zh-Hant">','<html lang="zh-Hans">')
      .replace(/Hatsu on · 日本語複習本/g,'日本語复习本')
      .replace(/v4\.0\.1/g,'v4.3.0');
    const favicon='<link rel="icon" type="image/svg+xml" href="./favicon.svg?v=430"><link rel="shortcut icon" href="./favicon.svg?v=430">';
    html=html.replace('</head>',favicon+'</head>');
    const closeScript='</scr'+'ipt>';
    const seedStart=html.indexOf('id="seedData"');
    const seedEnd=html.indexOf(closeScript,seedStart);
    if(seedStart<0||seedEnd<0) throw new Error('seedData not found');
    const pre='<script src="./prepatch-v4.1.0.js?v=430"><'+'/script>'+'<script src="./prepatch-v4.2.0.js?v=430"><'+'/script>'+'<script src="./prepatch-v4.3.0.js?v=430"><'+'/script>';
    html=html.slice(0,seedEnd+closeScript.length)+pre+html.slice(seedEnd+closeScript.length);
    const post='<script src="./postpatch-v4.1.0.js?v=430"><'+'/script>'+'<script src="./postpatch-v4.2.0.js?v=430"><'+'/script>'+'<script src="./postpatch-v4.3.0.js?v=430"><'+'/script>';
    html=html.replace('</body>',post+'</body>');
    document.open();document.write(html);document.close();
  }catch(e){document.body.innerHTML='<div class="loading"><b>加载失败</b><span>请刷新页面后重试。 '+String(e)+'</span></div>'}
})();
</script></body></html>
